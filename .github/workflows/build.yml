name: Build Sky.exe

on:
  push:
    branches: [ main, master, build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Build
      working-directory: ${{ github.workspace }}
      run: |
        MSBuild.exe Sky.sln /p:Configuration=Release /p:Platform=x64 /nologo /v:normal 2>&1
      env:
        PreferredToolArchitecture: x64

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sky.exe
        path: x64/Release/Sky.exe
        compression-level: 0
        if-no-files-found: error
